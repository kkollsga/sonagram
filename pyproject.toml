[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sonagram"
version = "0.1.0"
description = "Map a music library's analysis into a kglite knowledge graph for AI agents"
requires-python = ">=3.9"
license = {file = "LICENSE"}
readme = "README.md"
keywords = [
    "music",
    "knowledge-graph",
    "graph",
    "audio",
    "playlist",
    "cypher",
    "mir",
    "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "kglite>=0.14",
]

[project.urls]
Homepage = "https://github.com/kkollsga/sonagram"
Documentation = "https://github.com/kkollsga/sonagram#readme"
Repository = "https://github.com/kkollsga/sonagram"
Issues = "https://github.com/kkollsga/sonagram/issues"

[tool.maturin]
manifest-path = "sonagram-python/Cargo.toml"
python-source = "python"
module-name = "sonagram._sonagram"
features = ["pyo3/extension-module"]
