[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sonagram"
version = "0.2.0"
description = "Map a music library's analysis into a kglite knowledge graph for AI agents"
requires-python = ">=3.9"
license = {file = "LICENSE"}
readme = "README.md"
keywords = [
    "music",
    "knowledge-graph",
    "graph",
    "audio",
    "playlist",
    "cypher",
    "mir",
    "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "kglite>=0.14.3",
]

# Bundled Rust console script. The CLI is linked into this wheel's existing
# `_sonagram` extension (the `sonagram` core crate's `cli::run`), and the shim
# forwards `sys.argv[1:]` into it via `sonagram._sonagram._run_cli`. So
# `pip install sonagram` gives the same `sonagram` command as the cargo binary,
# from one shared code path — no separate build, no drift.
[project.scripts]
sonagram = "sonagram.cli:main"
sonagram-mcp-server = "sonagram.mcp_server:main"

[project.urls]
Homepage = "https://github.com/kkollsga/sonagram"
Documentation = "https://github.com/kkollsga/sonagram#readme"
Repository = "https://github.com/kkollsga/sonagram"
Issues = "https://github.com/kkollsga/sonagram/issues"

[tool.maturin]
manifest-path = "sonagram-python/Cargo.toml"
python-source = "python"
module-name = "sonagram._sonagram"
features = ["pyo3/extension-module"]
