name: Release

# Publishes the `sonagram` sdist to PyPI on a push to `main`, then tags the
# commit and cuts a GitHub Release.
#
# WHY A SEPARATE FILE (not ci.yml): PyPI Trusted Publishing (OIDC) is keyed to
# the exact **workflow filename**. sonagram's PyPI publisher is registered
# against `release.yml`, so the publish job MUST live here — an OIDC mint from
# any other workflow (e.g. ci.yml) is rejected by PyPI. See the `publish`
# job's permissions/environment below for the values the maintainer registered.
#
# Idempotent + version-gated: the job reads the version from pyproject.toml,
# checks PyPI, and skips every publish step when that version already exists —
# so a re-push of `main` at an unchanged version is a safe no-op.
#
# WHY THIS FILE RUNS TESTS: codingest's release.yml assumes `main` was already
# green (it triggers on a version tag, downstream of CI). sonagram publishes on
# a plain push to `main`, and GitHub Actions cannot `needs:` a job in another
# workflow — so ci.yml's matrix can't gate this file. Publishing an untested
# `main` is not acceptable, so `release.yml` runs its own essential gate
# (`cargo test --workspace` + clippy + the Python API scripts) and the publish
# job `needs: [test]`. ci.yml still carries the full 3-OS matrix on the same
# push; this is the single-OS pre-publish gate.

on:
  push:
    branches: [main]

jobs:
  test:
    name: Pre-publish gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The path-dep upstreams (sonara, kglite) are siblings of this repo.
      # CI checks them out next to sonagram so the path deps resolve.
      # actions/checkout refuses paths outside the workspace, so check the
      # siblings out INSIDE it and move them up to where ../sonara &
      # ../KGLite path deps expect them.
      - name: Check out sonara
        uses: actions/checkout@v6
        with:
          repository: kkollsga/sonara
          path: _siblings/sonara
      - name: Check out kglite
        uses: actions/checkout@v6
        with:
          repository: kkollsga/kglite
          path: _siblings/KGLite
      - name: Place siblings beside the workspace
        run: |
          mv _siblings/sonara ../sonara
          mv _siblings/KGLite ../KGLite
          rmdir _siblings

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Python bindings
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          maturin develop --release -m sonagram-python/Cargo.toml

      - name: Python tests
        run: |
          source .venv/bin/activate
          shopt -s nullglob
          for t in tests/python/test_*.py; do
            echo "=== $t ==="
            python "$t"
          done

  publish:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Get package version
        id: version
        run: |
          VERSION=$(python -c "
          import tomllib, pathlib
          d = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(d['project']['version'])
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version exists on PyPI
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/sonagram/${{ steps.version.outputs.version }}/json/")
          if [ "$STATUS" = "200" ]; then
            echo "Published: version ${{ steps.version.outputs.version }} already on PyPI"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not published: version ${{ steps.version.outputs.version }} not found on PyPI"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist
        if: steps.check.outputs.exists == 'false'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m sonagram-python/Cargo.toml --out dist

      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Tag and create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" dist/* --generate-notes
