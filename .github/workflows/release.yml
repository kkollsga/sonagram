name: Release

# Publishes `sonagram` to PyPI on a push to `main` — prebuilt abi3 wheels for
# the common platforms plus the sdist fallback — then tags the commit and cuts
# a GitHub Release.
#
# WHY A SEPARATE FILE (not ci.yml): PyPI Trusted Publishing (OIDC) is keyed to
# the exact **workflow filename**. sonagram's PyPI publisher is registered
# against `release.yml`, so the publish job MUST live here — an OIDC mint from
# any other workflow (e.g. ci.yml) is rejected by PyPI.
#
# WHEELS (kglite's pattern): the extension is built with pyo3 `abi3-py39`, so
# ONE wheel per platform serves every CPython >= 3.9 — no per-Python matrix.
# Linux builds inside the manylinux2014 container via maturin-action (a bare
# build on the runner would tag a glibc too new for older distros). Users on
# these platforms need NO Rust toolchain; the sdist remains the fallback for
# everything else.
#
# SDIST: built and PROVEN in its own `build-sdist` job, not inside `publish`.
# It is the only artifact that resolves kglite from crates.io instead of the
# sibling ../KGLite checkout, and that property is invisible to every other CI
# context — so the job asserts it (scripts/verify_sdist.sh) and then actually
# pip-installs and imports the tarball before anything is uploaded.
#
# Idempotent + version-gated: the `version` job reads pyproject.toml, checks
# PyPI, and every expensive job skips when that version already exists — so a
# re-push of `main` at an unchanged version is a safe no-op.
#
# WHY THIS FILE RUNS TESTS: sonagram publishes on a plain push to `main`, and
# GitHub Actions cannot `needs:` a job in another workflow — so ci.yml's 3-OS
# matrix can't gate this file. `release.yml` runs its own single-OS essential
# gate and `publish` needs it; ci.yml still runs the full matrix on the same
# push.

on:
  push:
    branches: [main]

jobs:
  version:
    name: Version gate
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check pyproject version against PyPI
        id: check
        run: |
          VERSION=$(python3 -c "
          import tomllib, pathlib
          d = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(d['project']['version'])
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 404 is the only "publish" signal; 200 = already there; anything
          # else = can't tell, fail safe to don't-publish.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/sonagram/$VERSION/json")
          if [ "$STATUS" = "404" ]; then
            echo "Version $VERSION not on PyPI — will build and publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION already on PyPI or unverifiable (HTTP $STATUS) — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Pre-publish gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The path-dep upstreams (sonara, kglite) are siblings of this repo.
      # actions/checkout refuses paths outside the workspace, so check the
      # siblings out INSIDE it and move them up to where ../sonara &
      # ../KGLite path deps expect them.
      - name: Check out sonara
        uses: actions/checkout@v7
        with:
          repository: kkollsga/sonara
          ref: v0.3.6
          path: _siblings/sonara
      - name: Check out kglite
        uses: actions/checkout@v7
        with:
          repository: kkollsga/kglite
          ref: v0.16.20
          path: _siblings/KGLite
      - name: Place siblings beside the workspace
        run: |
          mv _siblings/sonara ../sonara
          mv _siblings/KGLite ../KGLite
          rmdir _siblings

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Python bindings
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          maturin develop --release -m sonagram-python/Cargo.toml

      - name: Python tests
        run: |
          source .venv/bin/activate
          shopt -s nullglob
          for t in tests/python/test_*.py; do
            echo "=== $t ==="
            python "$t"
          done

  # One abi3 wheel per platform (pyo3 abi3-py39 → cp39-abi3 tag serves every
  # CPython >= 3.9). Builds run in parallel with the test gate; nothing
  # reaches PyPI before `publish`, which needs both.
  build-wheels:
    name: Wheel ${{ matrix.target }}
    needs: [version]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Check out sonara
        uses: actions/checkout@v7
        with:
          repository: kkollsga/sonara
          ref: v0.3.6
          path: _siblings/sonara
      - name: Check out kglite
        uses: actions/checkout@v7
        with:
          repository: kkollsga/kglite
          ref: v0.16.20
          path: _siblings/KGLite
      - name: Place siblings beside the workspace
        shell: bash
        run: |
          mv _siblings/sonara ../sonara
          mv _siblings/KGLite ../KGLite
          rmdir _siblings

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          command: build
          args: --release -m sonagram-python/Cargo.toml --out dist
          # The manylinux build runs in a container that mounts only the
          # workspace — bind the ../sonara + ../KGLite siblings in at the same
          # paths so the path deps resolve. Ignored by non-container builds.
          docker-options: >-
            -v ${{ github.workspace }}/../sonara:${{ github.workspace }}/../sonara
            -v ${{ github.workspace }}/../KGLite:${{ github.workspace }}/../KGLite

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # The sdist is the fallback for every platform without a prebuilt wheel, and
  # it is the ONLY artifact whose kglite comes from crates.io rather than from
  # this repo's sibling checkouts. That property (see PR #9 and
  # .cargo/config.toml) is invisible to every other CI context, so it gets
  # built, asserted, and actually installed here — before publish, not inside
  # it. Runs in parallel with build-wheels.
  build-sdist:
    name: Sdist + install probe
    needs: [version]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # The probe compiles the whole extension under lto = "fat" +
    # codegen-units = 1 (symphonia, rustfft, ndarray, rubato, ferricml, kglite,
    # pyo3). 15-30 min is normal.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # BOTH siblings are required to BUILD the sdist even though only sonara
      # ends up inside it: sonara is a path dep maturin vendors, and the
      # .cargo/config.toml [patch.crates-io] entries force cargo to load
      # ../KGLite while resolving. A checkout of sonagram alone fails here.
      - name: Check out sonara
        uses: actions/checkout@v7
        with:
          repository: kkollsga/sonara
          ref: v0.3.6
          path: _siblings/sonara
      - name: Check out kglite
        uses: actions/checkout@v7
        with:
          repository: kkollsga/kglite
          ref: v0.16.20
          path: _siblings/KGLite
      - name: Place siblings beside the workspace
        run: |
          mv _siblings/sonara ../sonara
          mv _siblings/KGLite ../KGLite
          rmdir _siblings

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        id: sdist
        run: |
          set -euo pipefail
          pip install maturin
          maturin sdist -m sonagram-python/Cargo.toml --out dist
          # Glob rather than reconstruct the filename: PEP 625 normalisation
          # means the tarball name is maturin's to decide, not ours.
          shopt -s nullglob
          found=(dist/*.tar.gz)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "expected exactly one sdist in dist/, got ${#found[@]}: ${found[*]:-<none>}" >&2
            exit 1
          fi
          echo "path=$(pwd)/${found[0]}" >> "$GITHUB_OUTPUT"

      # Asserts the PR #9 contract (no vendored kglite, sonara vendored, no
      # .cargo/config.toml packaged, cargo metadata resolves kglite from
      # crates.io) rather than merely "the tarball exists". The script unpacks
      # strictly outside the workspace — see its header for why that matters.
      - name: Verify sdist contract
        run: ./scripts/verify_sdist.sh "${{ steps.sdist.outputs.path }}"

      # Installing a .tar.gz already builds from source. Deliberately NOT
      # --no-binary :all: — sonagram runtime-depends on the kglite PyPI wheel,
      # and :all: would compile that from source too: 10+ extra minutes spent
      # testing kglite's sdist instead of ours.
      #
      # Everything happens under $RUNNER_TEMP, never under $GITHUB_WORKSPACE:
      # cargo discovers .cargo/config.toml by walking CWD upward, so a build or
      # an import inside the workspace would find this repo's [patch.crates-io]
      # and quietly resolve kglite from ../KGLite — passing the probe for
      # exactly the wrong reason.
      - name: Install the sdist into a clean venv and probe it
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          SDIST: ${{ steps.sdist.outputs.path }}
        run: |
          set -euo pipefail
          PROBE="$(mktemp -d "${RUNNER_TEMP}/sdist-probe.XXXXXXXX")"
          case "$PROBE/" in
            "$GITHUB_WORKSPACE"/*)
              echo "probe dir $PROBE is inside the workspace — refusing" >&2
              exit 1 ;;
          esac
          cd "$PROBE"
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install --no-binary sonagram "$SDIST"

          EMPTY="$PROBE/empty-library"
          mkdir -p "$EMPTY"

          ./venv/bin/python - <<'PY'
          import os
          import sonagram

          expected = os.environ["EXPECTED_VERSION"]
          assert sonagram.__version__ == expected, (
              f"sdist install reports {sonagram.__version__!r}, expected {expected!r}"
          )
          # Pure in-memory, no I/O and no music library needed.
          policy = sonagram.curation_policy("focus")
          assert policy, "curation_policy('focus') returned nothing"
          print(f"import OK: sonagram {sonagram.__version__}")
          PY

          # Console scripts prove the [project.scripts] wiring reaches
          # _sonagram._run_cli. Exit codes match tests/python/test_cli.py.
          ./venv/bin/sonagram --version
          echo "sonagram --version -> 0"
          ./venv/bin/sonagram skill show > /dev/null
          echo "sonagram skill show -> 0"
          set +e
          ./venv/bin/sonagram status "$EMPTY" > /dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "sonagram status <uncached dir> should exit 2, got $rc" >&2
            exit 1
          fi
          echo "sonagram status <uncached dir> -> 2"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          # `wheel-` prefix on purpose: publish collects everything matching
          # `wheel-*` with merge-multiple, so this needs no change there.
          name: wheel-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, test, build-wheels, build-sdist]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Wheels from build-wheels plus the sdist from build-sdist (uploaded as
      # `wheel-sdist`). This job builds nothing — it needs no Rust toolchain and
      # no sibling checkouts, which keeps the job holding `id-token: write` as
      # small as it can be.
      - name: Collect distributions
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: List distribution files
        run: ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" dist/* --generate-notes
