name: CI

# Tests only — the full cross-platform matrix on every push + PR.
# PyPI publishing lives in `release.yml` (NOT here): PyPI Trusted Publishing is
# keyed to the workflow filename, and sonagram's registered publisher is
# `release.yml`. Keep this file free of any PyPI/OIDC step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The path-dep upstreams (sonara, kglite) are siblings of this repo.
      # CI checks them out next to sonagram so the path deps resolve.
      - name: Check out sonara
        uses: actions/checkout@v6
        with:
          repository: kkollsga/sonara
          path: ../sonara
      - name: Check out kglite
        uses: actions/checkout@v6
        with:
          repository: kkollsga/kglite
          path: ../KGLite

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Python bindings
        if: matrix.os != 'windows-latest'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          maturin develop --release -m sonagram-python/Cargo.toml

      - name: Python tests
        if: matrix.os != 'windows-latest'
        run: |
          source .venv/bin/activate
          shopt -s nullglob
          for t in tests/python/test_*.py; do
            echo "=== $t ==="
            python "$t"
          done
