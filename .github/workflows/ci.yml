name: CI

# Tests only — the full cross-platform matrix on every push + PR.
# PyPI publishing lives in `release.yml` (NOT here): PyPI Trusted Publishing is
# keyed to the workflow filename, and sonagram's registered publisher is
# `release.yml`. Keep this file free of any PyPI/OIDC step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The path-dep upstreams (sonara, kglite) are siblings of this repo.
      # CI checks them out next to sonagram so the path deps resolve.
      # actions/checkout refuses paths outside the workspace, so check the
      # siblings out INSIDE it and move them up to where ../sonara &
      # ../KGLite path deps expect them.
      - name: Check out sonara
        uses: actions/checkout@v7
        with:
          repository: kkollsga/sonara
          ref: v0.3.6
          path: _siblings/sonara
      - name: Check out kglite
        uses: actions/checkout@v7
        with:
          repository: kkollsga/kglite
          ref: v0.16.5
          path: _siblings/KGLite
      - name: Place siblings beside the workspace
        run: |
          mv _siblings/sonara ../sonara
          mv _siblings/KGLite ../KGLite
          rmdir _siblings

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Formatting is gated so the drift that accumulated before 0.2.5 cannot
      # silently return. Placed after the real gates deliberately: a formatting
      # nit must never be the thing that hides a failing test in the log.
      #
      # SCOPED TO OUR OWN CRATES, never `--all`. `cargo fmt --all` also formats
      # "local path-based dependencies", which here means the sonara sibling
      # checkout -- an upstream that is READ-ONLY from this repo. `--all` both
      # gated CI on sonara's formatting (it failed on all three runners against
      # sonara/src, not ours) and, run locally, rewrote four files in the
      # sibling working tree. That local rewrite is also why the local check
      # went green while CI went red: the check passed against files it had
      # itself just reformatted.
      - name: Rustfmt
        run: cargo fmt -p sonagram -p sonagram-python --check

      - name: Build Python bindings
        if: matrix.os != 'windows-latest'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          maturin develop --release -m sonagram-python/Cargo.toml

      - name: Python tests
        if: matrix.os != 'windows-latest'
        run: |
          source .venv/bin/activate
          shopt -s nullglob
          for t in tests/python/test_*.py; do
            echo "=== $t ==="
            python "$t"
          done
