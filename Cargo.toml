[workspace]
members = ["sonagram", "sonagram-python"]
resolver = "2"

[workspace.package]
version = "0.2.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/kkollsga/sonagram"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
blake3 = "1"
walkdir = "2"
thiserror = "2"
rayon = "1.11"
# HTTP for the Last.fm enrichment fetcher only (blocking, small).
ureq = { version = "2", features = ["json"] }

# Upstreams — consumed as cargo libraries, read-only here. `version` must be
# satisfiable by the LOCAL path checkout: sonara 0.3.6 (everything 0.3.5 gave us
# — validated v2 vocalness model, sample-rate-robust aggression-rank-v3 analysis
# with evidence support, complete recoverable MP3 probing, deterministic chord
# summaries — plus two additive capabilities. (1) A per-feature augment lane:
# `feature_dependencies` declares each feature's evidence class, `can_augment` /
# `augment_blocker` answer whether one feature can be recomputed from a cached
# `TrackAnalysis` without touching the audio and why not, and `augment_analysis`
# performs it, falling back to a single decode at the record's own sample rate
# when the evidence isn't there (an `aggression` request routing through its
# dedicated 22.05 kHz lane automatically). Provenance gains `bpm_min`/`bpm_max`
# additively so a configured tempo range is visible to cache freshness; the
# analysis schema version does NOT move, so our frozen fixtures and goldens still
# describe the same analysis. (2) Versioned similarity profiles:
# `SimilarityProfile::ALL` (Python: `SIMILARITY_PROFILES`) names each selectable
# distance-time weight table with its own version — `default` v2, `timbre` v1 —
# and the default profile is bit-identical to 0.3.5, so no stored vector and no
# distance we compute today changes. Adoption of both lanes is deliberately
# deferred: we pin the surface in `contract_sonara` so upstream drift fails at
# compile time, and consume it in a later plan), kglite 0.16.17 (eight
# releases across four sonagram releases: 0.16.10 + 0.16.11 + 0.16.12 shipped
# in 0.2.9, 0.16.13 in 0.2.10, 0.16.14 + 0.16.15 in 0.2.11, 0.16.16 + 0.16.17
# here; both goldens byte-identical and `capture_goldens` never run throughout.
# All were zero-source-change bumps except 0.16.14, whose change was import
# paths only (see below).
#
# 0.16.10 is retrieval machinery: `build_text_index` / `text_bm25()` /
# `score_fuse()` add a BM25 lexical lane, and vector indexes gain the same
# incremental catch-up contract. We build no index of any kind. Our vector
# lane is `kglite::api::algorithms::vector_search` over an `EmbeddingStore`
# (`sonagram/src/graph/derive.rs:40`) — the exact scan, which is the oracle
# the HNSW path is measured against and is untouched by the catch-up work.
# The `.kgl` vector-index section's payload version moves to 3, but that
# section is a rebuildable cache we never write, and a graph with no text
# index writes byte-identical files; both goldens confirm it. Its perf items
# sit outside us too: the streaming-aggregate group cap (same rows, same
# order), the `storage="mapped"` first-property-probe index (we build
# in-memory graphs only), the `text_bm25` top-k fusion (no index), and the
# MCP server's opt-in `--parallel` read pin (off by default, reads only,
# identical answers either way).
#
# 0.16.11 is the ontology / label / structured-data layer, every piece of it
# declaration-gated: `define_ontology` + `materialize_ontology`, label
# alternation `MATCH (n:A|B)`, table properties with declared shapes, and the
# `table.upsert` / `table.delete` procedures. We declare no ontology, carry no
# secondary label, and store no table property, so none of it changes what a
# query of ours matches.
#
# The one item that could have reached us without an explicit call is the
# `vacuum()` fix: auto-vacuum is on by default (threshold 0.3), and the
# compaction was leaving `secondary_label_index` buckets pointing at stale
# node indices — phantom rows, over-counted `count()`, lost labels. It
# corrupts secondary labels only, and we create none (no `add_label`, no
# `set_parent_type`, no ontology materialization), so no `.kgl` we have ever
# written could carry the damage. Both goldens verify the digest regardless.
#
# One change is BREAKING-shaped and we are outside it: the six
# declaration-backed rule procedures gained a `rule` column, so a bare `CALL`
# returns one more column than before. We issue no `CALL` anywhere — swept
# across src, the wrapper, tests, the agent docs and the playlist skill — so
# no taught query's result shape moves. Same for `CREATE INDEX` on a
# secondary-only label now erroring instead of silently building an index no
# lookup consults (we create no indexes) and blueprint junction-edge `rename`
# (we ship no blueprint). No semantics change on any query our docs teach, so
# no new discriminating pin test — traversal_semantics.rs continues to pin the
# 0.16.6 trail behavior.
#
# 0.16.12 is a pure ontology-layer patch and is the cleanest non-event of the
# three: `required_properties` / `property_types` were declared-but-dead and
# now produce audit rows, `inverse_name` stopped auto-enrolling the physical
# inverse check (it is a reading-direction alias; the audit had been scoring
# every naming-only declaration as 100% violations, and `enforcement: error`
# made correctly modelled graphs unbuildable), and `enforcement` gained a
# per-check severity map. Every one of those reaches a graph only through
# `define_ontology`, which we never call — so unlike the vacuum() fix in
# 0.16.11, there is no default-on path by which any of it could touch us.
#
# 0.16.13 is ontology follow-ups plus label-alternation planning, and it is
# the first of these to declare a **Rust API break**: `api::RelationshipDecl`
# gained public fields `exempt` and `ancestry`, so a struct-literal
# construction must add them. We never name the type (verified by grep and by
# a clean `cargo build`), because we never call `define_ontology` — so the
# break is declared past us rather than absorbed. Its column changes are the
# same story one level up: `CALL ontology_audit()` gains `exempted` and
# `domain_class`, `SHOW ONTOLOGY` gains `exempt`, and the new
# `CALL edge_property_violation()` joins them — we issue no `CALL`.
#
# Its non-ontology fixes are the ones worth reading, because they are NOT
# declaration-gated — they gate on an *index* existing, and we create none:
# an index on `name` held a strict subset of what the same `MATCH` matched
# (`n.name` falls back to the node title, `create_index` reads the stored
# property alone), so building one silently dropped rows and `MERGE (n:T
# {name: …})` could duplicate the node it missed; an index pre-filter pruned
# every row against the *first* row's type, so an untyped `MATCH (n) WHERE
# n.city = 'x'` could drop other types' matches; and a fluent `where()` over a
# mixed-type set took the first indexed type's hits as the whole answer. We
# issue no `MERGE`, no untyped `MATCH … WHERE` equality, and no fluent
# `where()` — swept across src, wrapper, tests, agent docs and the playlist
# skill. Agents on a live graph that build indexes gain all three.
#
# 0.16.14's one BREAKING change — `max_rows` renamed `max_work_units` on
# `ExecuteOptions` / `CypherExecutor` / the Python keywords — misses us: we
# construct `ExecuteOptions::eager(&params)` and never set the field (swept
# src, bindings, wrapper, tests). What we DID take is its facade re-exports:
# our four `use kglite::datatypes::values::{...}` imports (graph/mod.rs,
# graph/song.rs, graph/derive.rs, tests/golden_graph.rs) now come from
# `kglite::api::mutation` — the curated surface exporting the types its own
# signatures name, which is exactly the reach-past those re-exports exist to
# end. Same types, zero behaviour change. Its two data fixes reach us
# passively and only as repairs: a reloaded `.kgl` no longer reports zero
# edges per relationship type when counts weren't warm at save time (the load
# now recounts instead of trusting fabricated zeros — repairs already-written
# files), and two saves of the same graph are byte-identical again (four
# persisted lists were in hash-map order), which is our own determinism
# promise extended to the `.kgl` bytes themselves.
#
# 0.16.15 is entirely opt-in load machinery we don't opt into: `LoadOptions`
# (`storage` / `defer_index_rebuild` on `load_file_with`; our `load_file`
# calls are unchanged and are exactly the default options),
# `estimate_load_memory` + `max_load_mb`, a true `row_limit` result cap, and
# `KGLITE_TMPDIR`. Its fixes (spill-dir reclamation after a kill, concurrent
# load errors, load errors naming operation + path) reach us passively and
# are all improvements. No graph semantics move; both goldens confirm.
#
# 0.16.16's one removal — `QueryDiagnostics::timed_out`, a field no engine
# code ever wrote (constant `false`) — misses us: we never read query
# diagnostics (swept src, bindings, wrapper, tests). Its additions are a
# `FilterCondition` re-export for the fluent traversal API (we call none of
# it) and a GraphML `label` key (we export no GraphML). The fixes worth
# knowing exist are cancellation/deadline polling inside variable-length
# expansion and the MATCH row loops — passive, and we set no query deadline
# and no cancel flag, so they change nothing we observe; upstream measured
# the added poll flat (worst benchmark cell +8.7% within its own run-to-run
# noise). Upstream also collapsed its three publish workflows into one
# release.yml — their infra, invisible to a cargo consumer.
#
# 0.16.17 is dependency-tree hygiene with no API or behavior change: geo is
# pulled with default-features = false (we declare no direct geo dependency,
# so nothing to re-activate), and the crate README/embedding guide gained the
# debug-footprint recipe — which we adopted the same day via their inbox note
# (see [profile.dev.package."*"] at the bottom of this file).
#
# Perf controls: neither 0.16.16 nor 0.16.17 describes an op as improved, so no new
# disqualification. The 0.16.15 `.kgl`-load disqualification was scoped to
# the 0.2.11 bump and has expired; loads did not move this release, making
# them measurable-stable-across-the-last-dependency-move again once
# re-measured. The 0.16.13 pair (streaming `count(*) ... LIMIT k`, any
# `text_bm25` top-k) stays retired as a control. Scan/analysis-side ops
# don't touch kglite at all and remain the safest anchors.
#
# The upstream contract these pins encode — what we consume, what we must never
# depend on, and what we owe each upstream in notification — is recorded in the
# repo's local design notes; `sonagram/tests/version_consistency.rs` is the
# mechanical half and enumerates every site that must agree with these pins.
sonara = { version = "0.3.6", path = "../sonara/sonara", features = ["aggression"] }
kglite = { version = "0.16.17", default-features = false }
kglite-mcp-server = { version = "0.16.17", default-features = false }

# Bindings only. `extension-module` is NOT enabled here so `cargo test
# --workspace` can link the cdylib test harness against a real libpython;
# maturin turns it on at wheel-build time via pyproject `features`.
[workspace.dependencies.pyo3]
version = "0.28"
features = ["abi3-py39"]

[workspace.dependencies.numpy]
version = "0.28"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Dependency debug info: line-tables-only (kglite's measured recipe, their
# 2026-08-31 compile-footprint note — rlib −43%, debug tree ~−22%; our own
# workspace crates keep full debug info; dependency backtraces keep file/line).
[profile.dev.package."*"]
debug = "line-tables-only"
