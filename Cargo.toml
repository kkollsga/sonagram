[workspace]
members = ["sonagram", "sonagram-python"]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/kkollsga/sonagram"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
blake3 = "1"
walkdir = "2"
thiserror = "2"
rayon = "1.11"
# HTTP for the Last.fm enrichment fetcher only (blocking, small).
ureq = { version = "2", features = ["json"] }

# Upstreams — consumed as cargo libraries, read-only here. `version` must be
# satisfiable by the LOCAL path checkout: sonara 0.3.5 (validated v2 vocalness
# model, sample-rate-robust aggression-rank-v3 analysis with evidence support,
# stable public analysis/model behavior, complete recoverable MP3 probing,
# deterministic chord summaries; 0.3.5 itself is release/CI-only and
# analysis-identical to 0.3.4), kglite 0.15.8 (a saved graph records its
# storage mode and reopens in it, `storage=` converts an existing graph
# instead of refusing, the servers' `--storage` applies to an existing graph,
# boot-validated Cypher recipe catalogs for MCP agents, a write loop no longer
# evicts other graphs' cached query plans, and negative numeric literals parse
# in MATCH inline property maps).
#
# The upstream contract these pins encode — what we consume, what we must never
# depend on, and what we owe each upstream in notification — is recorded in the
# repo's local design notes; `sonagram/tests/version_consistency.rs` is the
# mechanical half and enumerates every site that must agree with these pins.
sonara = { version = "0.3.5", path = "../sonara/sonara", features = ["aggression"] }
kglite = { version = "0.15.8", default-features = false }
kglite-mcp-server = { version = "0.15.8", default-features = false }

# Bindings only. `extension-module` is NOT enabled here so `cargo test
# --workspace` can link the cdylib test harness against a real libpython;
# maturin turns it on at wheel-build time via pyproject `features`.
[workspace.dependencies.pyo3]
version = "0.28"
features = ["abi3-py39"]

[workspace.dependencies.numpy]
version = "0.28"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
