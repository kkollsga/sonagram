[workspace]
members = ["sonagram", "sonagram-python"]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/kkollsga/sonagram"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
blake3 = "1"
walkdir = "2"
thiserror = "2"
rayon = "1.11"
# HTTP for the Last.fm enrichment fetcher only (blocking, small).
ureq = { version = "2", features = ["json"] }

# Upstreams — consumed as cargo libraries, read-only here. `version` must be
# satisfiable by the LOCAL path checkout: sonara 0.3.6 (everything 0.3.5 gave us
# — validated v2 vocalness model, sample-rate-robust aggression-rank-v3 analysis
# with evidence support, complete recoverable MP3 probing, deterministic chord
# summaries — plus two additive capabilities. (1) A per-feature augment lane:
# `feature_dependencies` declares each feature's evidence class, `can_augment` /
# `augment_blocker` answer whether one feature can be recomputed from a cached
# `TrackAnalysis` without touching the audio and why not, and `augment_analysis`
# performs it, falling back to a single decode at the record's own sample rate
# when the evidence isn't there (an `aggression` request routing through its
# dedicated 22.05 kHz lane automatically). Provenance gains `bpm_min`/`bpm_max`
# additively so a configured tempo range is visible to cache freshness; the
# analysis schema version does NOT move, so our frozen fixtures and goldens still
# describe the same analysis. (2) Versioned similarity profiles:
# `SimilarityProfile::ALL` (Python: `SIMILARITY_PROFILES`) names each selectable
# distance-time weight table with its own version — `default` v2, `timbre` v1 —
# and the default profile is bit-identical to 0.3.5, so no stored vector and no
# distance we compute today changes. Adoption of both lanes is deliberately
# deferred: we pin the surface in `contract_sonara` so upstream drift fails at
# compile time, and consume it in a later plan), kglite 0.16.5 (two releases in
# one move, 0.16.4 + 0.16.5. The v6 `.kgl` container still does not move for us:
# every format-affecting addition is opt-in and we opt into none of them, so the
# graph we build is unchanged — both goldens survived the bump byte-identical.
# The written container moves by exactly ONE byte, and it is the writer's own
# stamp: on a 32,890-track build, offset 5322, `"library_version":"0.16.3"` →
# `"0.16.5"`. Same size, same column order, and either binary reads either
# file identically. Mask that field before content-hashing a `.kgl`.
# The one change that reaches our source is a BREAKING Rust API move in 0.16.5:
# node, relationship and map properties are now `kglite::datatypes::PropMap`
# rather than `BTreeMap<String, Value>`. It is source-compatible for us because
# we never name that field's type nor match `Value::Map` as a `BTreeMap`; the
# type keeps key-ordered iteration, `Eq`, `Ord` and hashing, so our determinism
# rests on the same guarantee it always did. It buys read-path speed by making a
# materialised node's properties travel as a refcount instead of a deep copy
# (upstream measures `ORDER BY n` +36.6%, `collect(n)` +9.8% at 10k).
# Everything else is a capability we do not use and that costs nothing while
# unused: an opt-in parallel Cypher runtime (0.16.4) that is off by default and
# deliberately not exposed by the MCP or Bolt servers, so no served query
# changes; property-type constraints (0.16.4) and relationship constraints
# (0.16.5), both enforced only where declared — we declare none, so our files
# stay loadable by older kglite instead of tripping 0.16.4's format note; and
# change data capture, whose `state` column broke shape between 0.16.4 and
# 0.16.5 and reaches no consumer of ours because we never enable it. A graph
# that never enabled capture writes no epoch stamp and is byte-identical to
# before.
# Two fixes land under us without our asking: re-saving a loaded `.kgl` is now
# byte-stable (the loader rebuilt column order from a `HashMap`, so every load
# produced a differently-ordered save — precisely the non-determinism class this
# repo treats as a bug), and `UNWIND` over a collected list is no longer
# quadratic in memory. Note that a re-saved file stays ~79 bytes larger than a
# fresh save and reaches a fixed point after one cycle, by design: a load warms
# the `describe()` caches and a save persists them).
#
# The upstream contract these pins encode — what we consume, what we must never
# depend on, and what we owe each upstream in notification — is recorded in the
# repo's local design notes; `sonagram/tests/version_consistency.rs` is the
# mechanical half and enumerates every site that must agree with these pins.
sonara = { version = "0.3.6", path = "../sonara/sonara", features = ["aggression"] }
kglite = { version = "0.16.5", default-features = false }
kglite-mcp-server = { version = "0.16.5", default-features = false }

# Bindings only. `extension-module` is NOT enabled here so `cargo test
# --workspace` can link the cdylib test harness against a real libpython;
# maturin turns it on at wheel-build time via pyproject `features`.
[workspace.dependencies.pyo3]
version = "0.28"
features = ["abi3-py39"]

[workspace.dependencies.numpy]
version = "0.28"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
