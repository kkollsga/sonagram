[workspace]
members = ["sonagram", "sonagram-python"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kkollsga/sonagram"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
blake3 = "1"
walkdir = "2"
thiserror = "2"
rayon = "1.11"
# HTTP for the Last.fm enrichment fetcher only (blocking, small).
ureq = { version = "2", features = ["json"] }

# Upstreams — consumed as cargo libraries, read-only here. `version` must be
# satisfiable by the LOCAL path checkout: sonara 0.2.7 (complete recoverable MP3
# probing + Rust-bundled vocalness model), kglite 0.14.4 (deterministic embedding
# persistence). See
# dev-docs/designs/upstream-contracts.md.
sonara = { version = ">=0.2.7, <0.3", path = "../sonara/sonara" }
kglite = { version = "0.14.4", path = "../KGLite/crates/kglite", default-features = false }
kglite-mcp-server = { version = "0.14.4", path = "../KGLite/crates/kglite-mcp-server", default-features = false }

# Bindings only. `extension-module` is NOT enabled here so `cargo test
# --workspace` can link the cdylib test harness against a real libpython;
# maturin turns it on at wheel-build time via pyproject `features`.
[workspace.dependencies.pyo3]
version = "0.28"
features = ["abi3-py39"]

[workspace.dependencies.numpy]
version = "0.28"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
