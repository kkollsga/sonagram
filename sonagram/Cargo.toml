[package]
name = "sonagram"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Maps music-library analysis (sonara) into a kglite knowledge graph"
default-run = "sonagram"
readme = "../README.md"
keywords = ["music", "knowledge-graph", "audio", "playlist", "cypher"]
categories = ["multimedia::audio", "database"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
blake3 = { workspace = true }
walkdir = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
ureq = { workspace = true }
sonara = { workspace = true }
kglite = { workspace = true }
kglite-mcp-server = { workspace = true }

[[bin]]
name = "sonagram-mcp-server"
path = "src/bin/sonagram-mcp-server.rs"

[dev-dependencies]
# Test-only: precise mtime control for the incremental-rescan stat fast-path
# tests (touch a file's mtime without touching its bytes). Never a runtime dep.
filetime = "0.2"
# Test-only: SHA-256 for the golden_graph gate's canonical-graph digest
# (`tests/golden_graph.rs`). The gate observes the graph; it never ships, so
# this is a dev-dependency only, never a normal dep.
sha2 = "0.10"
